[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netrecon"
version = "1.0.0"
description = "Network Reconnaissance & Vulnerability Scanner"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ernest Kosmatko", email = "ernest.kosmatko@gmail.com" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
netrecon = "netrecon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
